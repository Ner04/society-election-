<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%97%B3%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Election Admin</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  body { font-size: 15px; }
  .layout { display: grid; grid-template-columns: 230px 1fr; min-height: 100vh; }
  aside { background: var(--ink); color: #fff; padding: 20px 14px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; }
  aside .brand { font-weight: 800; font-size: 17px; padding: 0 10px 4px; }
  aside .brand small { display: block; font-weight: 500; opacity: .65; font-size: 12px; margin-top: 2px; }
  aside .nav { margin-top: 18px; display: flex; flex-direction: column; gap: 3px; }
  aside .nav button { text-align: left; background: transparent; border: 0; color: #cfd6e3; padding: 11px 12px; border-radius: 9px; font-weight: 600; font-size: 14.5px; display: flex; gap: 10px; align-items: center; }
  aside .nav button:hover { background: rgba(255,255,255,.07); color: #fff; }
  aside .nav button.on { background: #fff; color: var(--ink); }
  aside .foot { margin-top: auto; font-size: 12px; opacity: .7; padding: 0 10px; }
  .main { padding: 22px 30px 60px; min-width: 0; }
  .topbar { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
  .topbar h1 { margin: 0; font-size: 24px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 18px; }
  .tile { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
  .tile .k { color: var(--muted); font-size: 13px; font-weight: 600; }
  .tile .v { font-size: 34px; font-weight: 800; letter-spacing: -.02em; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .tile .s { font-size: 12.5px; color: var(--muted); }
  .tile.hero { background: var(--primary); color: #fff; border-color: var(--primary); }
  .tile.hero .k, .tile.hero .s { color: rgba(255,255,255,.8); }
  .bar-track { height: 8px; background: rgba(255,255,255,.25); border-radius: 99px; margin-top: 8px; overflow: hidden; }
  .bar-track i { display: block; height: 100%; background: #fff; border-radius: 99px; transition: width .6s; }
  .grid2 { display: grid; grid-template-columns: 1.6fr 1fr; gap: 18px; align-items: start; }
  .section-title { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; }
  .section-title h2 { margin: 0; font-size: 18px; }
  .post-res { margin-bottom: 22px; }
  .post-res h3 { font-size: 16px; display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
  .res-row { display: grid; grid-template-columns: 36px 1fr 60px; gap: 10px; align-items: center; margin-bottom: 8px; }
  .res-row .nm { font-weight: 600; font-size: 14px; display: flex; gap: 8px; align-items: center; }
  .res-row .track { height: 12px; background: #eeebe4; border-radius: 99px; overflow: hidden; margin-top: 5px; }
  .res-row .track i { display: block; height: 100%; background: #9fb4d9; border-radius: 99px; transition: width .6s; }
  .res-row.lead .track i { background: var(--ok); }
  .res-row .vt { text-align: right; font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums; }
  .res-row .vt small { display: block; font-size: 11px; color: var(--muted); font-weight: 600; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
  .badge.lead { background: var(--ok-soft); color: var(--ok); }
  .badge.tie { background: var(--warn-soft); color: var(--warn); }
  .badge.no { background: var(--bad-soft); color: var(--bad); }
  .badge.gray { background: #eceae4; color: var(--muted); }
  .blurred .res-body { filter: blur(9px); pointer-events: none; user-select: none; }
  .feed { display: flex; flex-direction: column; gap: 2px; max-height: 470px; overflow: auto; }
  .feed .it { display: flex; gap: 10px; padding: 8px 4px; border-bottom: 1px solid #f0ede6; font-size: 13.5px; align-items: flex-start; }
  .feed .ic { width: 28px; text-align: center; font-size: 16px; }
  .feed .tm { color: var(--muted); font-size: 12px; white-space: nowrap; margin-left: auto; }
  table.t { width: 100%; border-collapse: collapse; background: #fff; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); }
  table.t th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); background: #faf9f6; padding: 10px 12px; border-bottom: 1px solid var(--line); position: sticky; top: 0; }
  table.t td { padding: 9px 12px; border-bottom: 1px solid #f0ede6; vertical-align: middle; font-size: 14px; }
  table.t tr.click:hover td { background: #f8f7f3; cursor: pointer; }
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .toolbar input[type=search], .toolbar select { padding: 9px 12px; border: 1.5px solid var(--line); border-radius: 9px; background: #fff; min-width: 220px; }
  .post-card { margin-bottom: 16px; }
  .post-card .hd { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .post-card .hd h3 { margin: 0; font-size: 18px; }
  .cand-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; margin-top: 14px; }
  .cand-it { display: flex; gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
  .cand-it .sym { font-size: 22px; }
  .sym-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; margin: 6px 0 12px; }
  .sym-grid button { font-size: 22px; padding: 6px 0; background: #fff; border: 1.5px solid var(--line); border-radius: 8px; }
  .sym-grid button.on { border-color: var(--primary); background: var(--primary-soft); }
  .face-box { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
  .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
  .ctl { display: flex; gap: 10px; flex-wrap: wrap; }
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login { width: min(440px, 100%); }
  .login h1 { font-size: 24px; }
  .chart svg { width: 100%; height: 160px; display: block; }
  .integrity { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 10px; font-weight: 600; font-size: 13.5px; }
  .integrity.ok { background: var(--ok-soft); color: var(--ok); }
  .integrity.bad { background: var(--bad-soft); color: var(--bad); }
  .danger { border-color: #f1c7c2; }
  .hint { font-size: 13px; color: var(--muted); margin: -4px 0 12px; }
  .team-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .team-card { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); border-left: 7px solid var(--team); border-radius: 12px; padding: 10px 12px; }
  .team-card .team-sym { font-size: 26px; }
  .cgroup { border-left: 5px solid var(--team); padding-left: 12px; margin-top: 14px; }
  .cg-hd { font-weight: 800; color: var(--team); margin-bottom: 4px; }
  .cgroup .cand-list { margin-top: 6px; }
  .colbtn { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 1.5px var(--line); }
  .colbtn.on { box-shadow: 0 0 0 3px var(--ink); }
  .rank { width: 30px; height: 30px; border-radius: 50%; background: #eceae4; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; }
  .res-row.lead .rank { background: var(--ok); color: #fff; }
  .res-row[style*="--team"] .track i { background: color-mix(in srgb, var(--team) 45%, #fff); }
  .res-row.lead[style*="--team"] .track i { background: var(--team); }
  .tchip { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 6px; background: color-mix(in srgb, var(--team) 14%, #fff); color: var(--team); }
  .cutline { text-align: center; font-size: 11.5px; font-weight: 800; color: var(--ok); border-top: 2px dashed var(--ok); margin: 6px 0 10px; padding-top: 3px; text-transform: uppercase; letter-spacing: .05em; }
  .team-sum { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 6px 0 16px; }
  .team-sum .ts { border: 1px solid var(--line); border-top: 5px solid var(--team); border-radius: 10px; padding: 8px 12px; }
  .team-sum .tn { font-weight: 800; color: var(--team); font-size: 13.5px; }
  .team-sum .tw b { font-size: 24px; }
  .wtab input { padding: 6px 8px; border: 1.5px solid var(--line); border-radius: 8px; }
  .wtab td { padding: 6px 10px; }
  @media (max-width: 1000px) { .grid2, .settings-grid, .face-box { grid-template-columns: 1fr; } }
  @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } aside { position: static; height: auto; } aside .nav { flex-direction: row; flex-wrap: wrap; } .main { padding: 16px; } }
</style>
</head>
<body>
<div id="login" class="login-wrap hidden"></div>
<div id="app" class="layout hidden">
  <aside class="no-print">
    <div class="brand">🗳️ Election Admin<small id="sideSociety"></small></div>
    <div class="nav" id="nav">
      <button data-tab="dashboard" class="on">📊 Live Dashboard</button>
      <button data-tab="voters">👥 Voters</button>
      <button data-tab="candidates">🚩 Teams &amp; Candidates</button>
      <button data-tab="audit">📜 Audit Log</button>
      <button data-tab="settings">⚙️ Settings &amp; Backup</button>
    </div>
    <div class="foot">
      <div style="margin-bottom:10px"><a href="/booth" target="_blank" style="color:#fff">Open voting booth ↗</a><br><a href="/display" target="_blank" style="color:#fff">Open results screen ↗</a></div>
      <button class="btn small secondary" id="btnLogout">Log out</button>
    </div>
  </aside>
  <div class="main">
    <div class="topbar">
      <h1 id="pageTitle">Live Dashboard</h1>
      <span class="pill" id="statusPill"></span>
      <div class="spacer"></div>
      <span class="muted mono" id="clock"></span>
    </div>
    <section id="tab-dashboard"></section>
    <section id="tab-voters" class="hidden"></section>
    <section id="tab-candidates" class="hidden"></section>
    <section id="tab-audit" class="hidden"></section>
    <section id="tab-settings" class="hidden"></section>
  </div>
</div>
<script src="/vendor/face-api.js"></script>
<script src="/vendor/qrcode.js"></script>
<script src="/js/common.js"></script>
<script src="/js/face.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
